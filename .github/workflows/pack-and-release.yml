name: Pack and Release (from build artifacts)

on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed successful Build and Release DMF run ID'
        required: true
        type: string
      release_tag:
        description: 'Existing tag matching that build, e.g. v1.1.159-playcast.1'
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: dmf-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  pack-and-release:
    runs-on: windows-2022
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve source and existing release tag
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./build/Resolve-ReleaseSource.ps1 -RunId $env:SOURCE_RUN_ID -Tag $env:RELEASE_TAG
      - name: Retain packaging tooling across source checkout
        shell: pwsh
        run: |
          Copy-Item -LiteralPath ./build/New-ReleaseArchives.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'Dmf-NewReleaseArchives.ps1') -ErrorAction Stop
          Copy-Item -LiteralPath ./build/ReleasePolicy.psm1 -Destination (Join-Path $env:RUNNER_TEMP 'Dmf-ReleasePolicy.psm1') -ErrorAction Stop
      - name: Checkout matching source headers
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.source.outputs.head_sha }}
      - name: Download the eight matrix artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh run download $env:SOURCE_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern 'Bin_*' --dir .output/release-inputs
          if ($LASTEXITCODE) { throw 'Artifact download failed.' }
      - name: Pack matching libraries and headers
        shell: pwsh
        run: "& (Join-Path $env:RUNNER_TEMP 'Dmf-NewReleaseArchives.ps1') -SourceRoot $env:GITHUB_WORKSPACE -BinariesRoot .output/release-inputs -OutputDirectory .output/release-archives"
      - name: Publish the exact triggering tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          EXPECTED_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module (Join-Path $env:RUNNER_TEMP 'Dmf-ReleasePolicy.psm1') -Force
          $tagCommit = Get-DmfRemoteTagCommit -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG
          if ($tagCommit -cne $env:EXPECTED_SHA) { throw 'Release tag moved after source validation.' }
          $archives = @(Get-ChildItem -LiteralPath .output/release-archives -File -Filter '*.zip' | ForEach-Object FullName)
          if ($archives.Count -ne 9) { throw 'Expected all nine release archives.' }
          gh release create $env:RELEASE_TAG @archives --repo $env:GITHUB_REPOSITORY --verify-tag --title "DMF $env:RELEASE_TAG" --generate-notes --latest
          if ($LASTEXITCODE) { throw 'Release publication failed; inspect any retained draft before retrying.' }
